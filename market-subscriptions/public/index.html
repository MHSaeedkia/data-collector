<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Market Subscriptions</title>
<style>
  :root {
    --bg:#eef0f1; --surface:#f8fafa; --surface-2:#e4e8e9; --ink:#14191c;
    --muted:#5c6b72; --line:#c7d0d3; --accent:#0e6e68;
    --ok:#1a7f4b; --off:#5c6b72; --pend:#a85b27; --err:#b3261e;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0e1215; --surface:#171d20; --surface-2:#1f262a; --ink:#dfe5e7;
            --muted:#93a2aa; --line:#2c353a; --accent:#4fb3aa;
            --ok:#4fbe86; --off:#93a2aa; --pend:#d9884a; --err:#f2756b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans)}
  header{padding:18px 22px;border-bottom:1px solid var(--line);background:var(--surface);
         display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{margin:0;font-size:17px;font-weight:600;letter-spacing:-.01em}
  .sub{color:var(--muted);font-size:12.5px}
  .counts{margin-left:auto;display:flex;gap:14px;font-family:var(--mono);font-size:12px}
  .counts span{color:var(--muted)}
  .counts b{font-weight:600}
  .bar{padding:14px 22px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
       border-bottom:1px solid var(--line)}
  select,input[type=search]{font:13px var(--sans);padding:6px 9px;border:1px solid var(--line);
       border-radius:3px;background:var(--surface);color:var(--ink);min-width:150px}
  button{font:13px var(--sans);padding:7px 14px;border:1px solid var(--line);border-radius:3px;
       background:var(--surface);color:var(--ink);cursor:pointer}
  button:hover:not(:disabled){border-color:var(--accent)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  .spacer{margin-left:auto;display:flex;gap:10px;align-items:center}
  .selcount{font-family:var(--mono);font-size:12px;color:var(--muted)}
  .wrap{overflow-x:auto;padding:0 22px 40px}
  table{border-collapse:collapse;width:100%;margin-top:14px;background:var(--surface);
        border:1px solid var(--line)}
  th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;background:var(--surface-2);font-size:10.5px;
        text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;
        cursor:pointer;user-select:none;white-space:nowrap}
  tbody tr:hover{background:var(--surface-2)}
  td.market,td.exch{font-family:var(--mono);font-size:13px}
  td.check,th.check{width:34px;text-align:center;cursor:default}
  .badge{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:10px;
        border:1px solid currentColor;white-space:nowrap}
  .s-subscribe{color:var(--ok)} .s-unsubscribe{color:var(--off)}
  .s-pending-subscribe,.s-pending-unsubscribe{color:var(--pend)}
  #toast{position:fixed;right:18px;bottom:18px;max-width:420px;display:flex;
        flex-direction:column;gap:8px;z-index:10}
  .msg{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);
        padding:10px 14px;border-radius:3px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
  .msg.bad{border-left-color:var(--err)}
  .msg pre{margin:6px 0 0;font:11.5px var(--mono);color:var(--muted);white-space:pre-wrap}
  .empty{padding:36px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Market Subscriptions</h1>
  <span class="sub">postgres is the source of truth &middot; NiFi settles every pending row</span>
  <div class="counts" id="counts"></div>
</header>

<div class="bar">
  <select id="fExchange"><option value="">All exchanges</option></select>
  <select id="fStatus">
    <option value="">All statuses</option>
    <option value="subscribe">subscribe</option>
    <option value="unsubscribe">unsubscribe</option>
    <option value="pending-subscribe">pending-subscribe</option>
    <option value="pending-unsubscribe">pending-unsubscribe</option>
  </select>
  <input type="search" id="fSearch" placeholder="Search market…">
  <button id="selAll">Select all shown</button>
  <button id="selNone">Clear</button>
  <div class="spacer">
    <span class="selcount" id="selCount">0 selected</span>
    <button class="primary" id="btnSub" disabled>Subscribe</button>
    <button id="btnUnsub" disabled>Unsubscribe</button>
  </div>
</div>

<div class="wrap">
  <table>
    <thead><tr>
      <th class="check"><input type="checkbox" id="checkAll"></th>
      <th data-sort="exchange_name">Exchange</th>
      <th data-sort="market">Market</th>
      <th data-sort="status">Status</th>
      <th data-sort="market_id">Pair ID</th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="empty" id="empty" hidden>No markets match these filters.</div>
</div>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
let all = [], selected = new Set(), sortKey = "exchange_name", sortAsc = true, timer = null;

const api = async (url, opts) => {
  const r = await fetch(url, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || `HTTP ${r.status}`);
  return body;
};

function visible() {
  const ex = $("#fExchange").value, st = $("#fStatus").value;
  const q = $("#fSearch").value.trim().toLowerCase();
  return all.filter(s =>
    (!ex || s.exchange_name === ex) &&
    (!st || s.status === st) &&
    (!q || s.market.toLowerCase().includes(q) || s.exchange_name.toLowerCase().includes(q)));
}

function render() {
  const rows = visible().sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    const c = typeof x === "number" ? x - y : String(x).localeCompare(String(y));
    return sortAsc ? c : -c;
  });
  $("#rows").innerHTML = rows.map(s => `
    <tr>
      <td class="check"><input type="checkbox" data-id="${s.id}" ${selected.has(s.id) ? "checked" : ""}></td>
      <td class="exch">${s.exchange_name}</td>
      <td class="market">${s.market}</td>
      <td><span class="badge s-${s.status}">${s.status}</span></td>
      <td class="market">${s.market_id}</td>
    </tr>`).join("");
  $("#empty").hidden = rows.length > 0;

  const by = k => all.filter(s => s.status === k).length;
  $("#counts").innerHTML =
    `<span>subscribed <b>${by("subscribe")}</b></span>` +
    `<span>unsubscribed <b>${by("unsubscribe")}</b></span>` +
    `<span>pending <b>${by("pending-subscribe") + by("pending-unsubscribe")}</b></span>` +
    `<span>total <b>${all.length}</b></span>`;

  const n = selected.size;
  $("#selCount").textContent = `${n} selected`;
  $("#btnSub").disabled = $("#btnUnsub").disabled = n === 0;
  const shown = rows.map(r => r.id);
  $("#checkAll").checked = shown.length > 0 && shown.every(id => selected.has(id));
}

async function load() {
  try {
    all = await api("/api/subscriptions");
    // Drop selections whose rows no longer exist, so a stale id can never be submitted.
    const live = new Set(all.map(s => s.id));
    selected = new Set([...selected].filter(id => live.has(id)));
    render();
  } catch (e) { toast(`Could not load markets: ${e.message}`, true); }
}

async function act(action) {
  const ids = [...selected];
  if (!ids.length) return;
  const verb = action === "subscribe" ? "Subscribe" : "Unsubscribe";
  if (!confirm(`${verb} ${ids.length} market(s)?\n\nThis sets them to pending-${action} and asks NiFi to act.`)) return;
  $("#btnSub").disabled = $("#btnUnsub").disabled = true;
  try {
    const { results } = await api("/api/actions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action, ids })
    });
    const bad = results.filter(r => !r.ok);
    const good = results.length - bad.length;
    if (bad.length) {
      toast(`${good} of ${results.length} sent. ${bad.length} failed — those rows were rolled back.`,
            true, bad.map(b => `${b.market}: ${b.error}`).join("\n"));
    } else {
      toast(`${good} market(s) set to pending-${action}. NiFi will confirm.`);
      selected.clear();
    }
  } catch (e) { toast(`Request failed: ${e.message}`, true); }
  await load();
}

function toast(text, bad = false, detail = "") {
  const el = document.createElement("div");
  el.className = "msg" + (bad ? " bad" : "");
  el.innerHTML = `<div></div>${detail ? "<pre></pre>" : ""}`;
  el.firstChild.textContent = text;
  if (detail) el.querySelector("pre").textContent = detail;
  $("#toast").append(el);
  setTimeout(() => el.remove(), bad ? 15000 : 6000);
}

$("#rows").addEventListener("change", e => {
  const id = Number(e.target.dataset.id);
  e.target.checked ? selected.add(id) : selected.delete(id);
  render();
});
$("#checkAll").addEventListener("change", e => {
  const shown = visible().map(s => s.id);
  e.target.checked ? shown.forEach(id => selected.add(id)) : shown.forEach(id => selected.delete(id));
  render();
});
$("#selAll").onclick = () => { visible().forEach(s => selected.add(s.id)); render(); };
$("#selNone").onclick = () => { selected.clear(); render(); };
$("#btnSub").onclick = () => act("subscribe");
$("#btnUnsub").onclick = () => act("unsubscribe");
["fExchange", "fStatus", "fSearch"].forEach(id => $("#" + id).addEventListener("input", render));
document.querySelectorAll("th[data-sort]").forEach(th => th.onclick = () => {
  const k = th.dataset.sort;
  sortAsc = sortKey === k ? !sortAsc : true;
  sortKey = k;
  render();
});

(async () => {
  try {
    const ex = await api("/api/exchanges");
    $("#fExchange").innerHTML = '<option value="">All exchanges</option>' +
      ex.map(e => `<option value="${e.name}">${e.label || e.name}</option>`).join("");
  } catch (e) { toast(`Could not load exchanges: ${e.message}`, true); }

  await load();

  const { refresh_seconds } = await api("/api/config").catch(() => ({ refresh_seconds: 0 }));
  if (refresh_seconds > 0) timer = setInterval(load, refresh_seconds * 1000);
})();
</script>
</body>
</html>
