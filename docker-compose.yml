            test: [ "CMD", "curl", "-f", "http://localhost:9250/metrics" ]
            interval: 20s
            timeout: 5s
            retries: 3
            start_period: 40s

    # S4 — post-mortem storage. Without it a JobManager restart takes every
    # failed job's exception, failing subtask and metrics with it, and the only
    # record left is whatever scrolled past in the container log. Independent of
    # checkpointing, so it lands despite the postponement.
    #
    # Deliberately has no `depends_on: jobmanager`: the failure this exists for
    # is a JobManager that died or is unhealthy, which is exactly when the
    # archive has to stay readable. It only reads a directory and never joins
    # the cluster, so it also gets none of the M3 HA keys.
    #
    # Same build as the cluster rather than the bare flink image: it is already
    # built locally, so this adds no pull.
    historyserver:
        build: ./flink/normalizer
        container_name: historyserver
        hostname: historyserver
        restart: unless-stopped
        command: history-server
        ports:
            # 7071 because 8082 — the HistoryServer's own default — is
            # schema-registry on the host and 8081 is NiFi. Container side stays
            # 8082. Host-agnostic: a port, not an address (see M8's removal).
            - "7071:8082"
        environment:
            FLINK_PROPERTIES: |
                historyserver.archive.fs.dir: file:///opt/flink/archive
                historyserver.archive.fs.refresh-interval: 10000

                # An in-container bind, not a host binding: the published port
                # above is unreachable if this ever defaults to loopback.
                historyserver.web.address: 0.0.0.0
                historyserver.web.port: 8082
        volumes:
            - data-collector-flink-archive:/opt/flink/archive
        networks:
            - data-collector-net
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8082/config" ]
            interval: 20s
            timeout: 5s
            retries: 3
            start_period: 30s

    kafka:
        image: confluentinc/cp-kafka:7.8.0
        container_name: kafka
        hostname: kafka
        restart: on-failure
        ports:
            - "9092:9092" # host access: localhost:9092
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:9092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
            CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg==
        volumes:
            - data-collector-kafka-data:/var/lib/kafka/data
            - data-collector-kafka-secrets:/etc/kafka/secrets
        networks:
            - data-collector-net
        healthcheck:
            test: [ "CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list" ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

    schema-registry:
        image: confluentinc/cp-schema-registry:7.6.1
        container_name: schema-registry
        hostname: schema-registry
        restart: on-failure
        depends_on:
            kafka:
                condition: service_healthy
        ports:
            - "8082:8082" # host: localhost:8082, inside docker: schema-registry:8082
        environment:
            SCHEMA_REGISTRY_HOST_NAME: schema-registry
            SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
            SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8082
        volumes:
            - data-collector-schema-registry-secrets:/etc/schema-registry/secrets
        networks:
            - data-collector-net
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8082/subjects" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s

    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        hostname: kafka-ui
        restart: on-failure
        depends_on:
            kafka:
                condition: service_healthy
            schema-registry:
                condition: service_healthy
        ports:
            - "8080:8080" # host: localhost:8080
        environment:
            KAFKA_CLUSTERS_0_NAME: local
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
            KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8082
            # Input/output topic names don't match Confluent's default TopicNameStrategy
            # (<topic>-value), so without this kafka-ui finds no serde at all for them (empty
            # valueSerde, nothing to pick when producing). Bind each topic pattern to the one
            # canonical registry subject it actually uses instead of registering a subject per
            # topic (see scripts/warmup.sh).
            KAFKA_CLUSTERS_0_SERDE_0_NAME: AggregatedOrderBookEventAvro
            KAFKA_CLUSTERS_0_SERDE_0_CLASSNAME: com.provectus.kafka.ui.serdes.builtin.sr.SchemaRegistrySerde
            KAFKA_CLUSTERS_0_SERDE_0_TOPICVALUESPATTERN: ^p[0-9]+-(asks|bids)$
            KAFKA_CLUSTERS_0_SERDE_0_PROPERTIES_URL: http://schema-registry:8082
            KAFKA_CLUSTERS_0_SERDE_0_PROPERTIES_SCHEMANAMETEMPLATE: aggregated-order-book-event
            KAFKA_CLUSTERS_0_SERDE_1_NAME: ControlCommandAvro
            KAFKA_CLUSTERS_0_SERDE_1_CLASSNAME: com.provectus.kafka.ui.serdes.builtin.sr.SchemaRegistrySerde
            KAFKA_CLUSTERS_0_SERDE_1_TOPICVALUESPATTERN: ^control-plane$
            KAFKA_CLUSTERS_0_SERDE_1_PROPERTIES_URL: http://schema-registry:8082
            KAFKA_CLUSTERS_0_SERDE_1_PROPERTIES_SCHEMANAMETEMPLATE: control-command

        networks:
            - data-collector-net

    nifi:
        build: ./nifi
        container_name: nifi
        hostname: nifi
        restart: on-failure
        depends_on:
            kafka:
                condition: service_healthy
        environment:
            SINGLE_USER_CREDENTIALS_USERNAME: admin
            SINGLE_USER_CREDENTIALS_PASSWORD: admin123456789
            NIFI_WEB_PROXY_HOST: "192.168.150.104:8443,192.168.150.102:8443,192.168.150.31:8443,192.168.150.32:8443,192.168.150.33:8443,localhost:8443"
            NIFI_JVM_HEAP_INIT: "8g"
            NIFI_JVM_HEAP_MAX: "8g"
        ports:
            - "8443:8443"
            - "8081:8081"
            - "9095:9095"
        volumes:
            - data-collector-nifi-conf:/opt/nifi/nifi-current/conf
            - data-collector-nifi-state:/opt/nifi/nifi-current/state
            - data-collector-nifi-logs:/opt/nifi/nifi-current/logs
            - data-collector-nifi-python-extensions:/opt/nifi/nifi-current/python_extensions
            - data-collector-nifi-database-repository:/opt/nifi/nifi-current/database_repository
            - data-collector-nifi-nar-extensions:/opt/nifi/nifi-current/nar_extensions
            - data-collector-nifi-provenance-repository:/opt/nifi/nifi-current/provenance_repository
            - data-collector-nifi-content-repository:/opt/nifi/nifi-current/content_repository
            - data-collector-nifi-flowfile-repository:/opt/nifi/nifi-current/flowfile_repository
        logging:
            driver: json-file
            options:
                max-size: "1G"
                max-file: "10"
        networks:
            - data-collector-net
        healthcheck:
            test: [ "CMD-SHELL", "curl -k -s -o /dev/null -w '%{http_code}' https://$(hostname):8443/nifi-api/system-diagnostics | grep -qE '^[2-4]'" ]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 90s

    postgres:
        image: postgres:18
        container_name: postgres
        hostname: postgres
        restart: on-failure
        ports:
            - "5432:5432"
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
            POSTGRES_DB: postgres
        volumes:
            - data-collector-postgres-data:/var/lib/postgresql/18/docker
            - data-collector-postgres-lib:/var/lib/postgresql
            - ./postgres:/docker-entrypoint-initdb.d
        networks:
            - data-collector-net
        healthcheck:
            test: [ "CMD-SHELL", "pg_isready -U postgres" ]
            interval: 10s
            retries: 5

    redis:
        image: redis:7-alpine
        container_name: redis
        hostname: redis
        restart: on-failure
        command: [ "redis-server", "--appendonly", "yes" ]
        ports:
            - "6379:6379"
        volumes:
            - data-collector-redis-data:/data
        networks:
            - data-collector-net
        healthcheck:
            test: [ "CMD", "redis-cli", "ping" ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    redis-exporter:
        image: oliver006/redis_exporter:latest
        container_name: redis-exporter
        hostname: redis-exporter
        restart: on-failure
        depends_on:
            redis:
                condition: service_healthy
        environment:
            REDIS_ADDR: "redis://redis:6379"
        ports:
            - "9121:9121"
        networks:
            - data-collector-net

    kafka-exporter:
        image: danielqsj/kafka-exporter:latest
        container_name: kafka-exporter
        hostname: kafka-exporter
        restart: on-failure
        depends_on:
            kafka:
                condition: service_healthy
        command:
            - "--kafka.server=kafka:29092"
        ports:
            - "9308:9308"
        networks:
            - data-collector-net

    lpa-staleness-exporter:
        build: ./lpa-staleness-exporter
        container_name: lpa-staleness-exporter
        hostname: lpa-staleness-exporter
        restart: on-failure
        depends_on:
            kafka:
                condition: service_healthy
        volumes:
            - ./lpa-staleness-exporter/config.yaml:/config/config.yaml:ro
        ports:
            - "9309:9309"
        networks:
            - data-collector-net

    # M9 — until this block existed nothing scraped a single one of the metrics
    # this stack already exports: both Flink processes run a Prometheus
    # reporter, and kafka-exporter, redis-exporter and lpa-staleness-exporter
    # sit right above. Every failure mode in the production review was detected
    # by a human noticing stale data.
    #
    # All config is in ./monitoring, mounted read-only. What is alerted on, and
    # why each threshold is what it is, is documented in
    # monitoring/prometheus/rules/flink.yml. Host-agnostic like the rest of the
    # file: every scrape target is a compose service name, and no root URL or
    # host address is baked in anywhere (see M8's removal).
    prometheus:
        image: prom/prometheus:v2.53.0
        container_name: prometheus
        hostname: prometheus
        restart: unless-stopped
        # Deliberately no depends_on. Its entire job is to notice that a target
        # is down, which it cannot do if it waits for that target to be healthy
        # before starting.
        command:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            # Long enough to post-mortem the failures the review describes,
            # short enough that the volume stays sane on a dev box.
            - "--storage.tsdb.retention.time=15d"
            # Lets `curl -XPOST :9090/-/reload` pick up rule edits without a
            # restart, which matters because the rules are bind-mounted.
            - "--web.enable-lifecycle"
        ports:
            - "9090:9090"
        volumes:
            - ./monitoring/prometheus:/etc/prometheus:ro
            - data-collector-prometheus-data:/prometheus
        networks:
            - data-collector-net
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"
        healthcheck:
            test: [ "CMD", "wget", "-qO-", "http://localhost:9090/-/healthy" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

    # ⚠ Routes nowhere until a receiver is filled in — the project has no agreed
    # notification channel. Alerts are still visible on its UI and Prometheus's
    # /alerts. See the header of monitoring/alertmanager/alertmanager.yml.
    alertmanager:
        image: prom/alertmanager:v0.27.0
        container_name: alertmanager
        hostname: alertmanager
        restart: unless-stopped
        command:
            - "--config.file=/etc/alertmanager/alertmanager.yml"
            - "--storage.path=/alertmanager"
        ports:
            - "9093:9093"
        volumes:
            - ./monitoring/alertmanager:/etc/alertmanager:ro
            - data-collector-alertmanager-data:/alertmanager
        networks:
            - data-collector-net
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"

    grafana:
        image: grafana/grafana:11.1.0
        container_name: grafana
        hostname: grafana
        restart: unless-stopped
        ports:
            # 3001 because 3000 is the web service. Container side stays 3000.
            - "3001:3000"
        environment:
            # Dev-grade, in keeping with the rest of this file. Note there is
            # deliberately no GF_SERVER_ROOT_URL: it would have to name a host,
            # and Grafana does not need it for direct access.
            GF_SECURITY_ADMIN_USER: admin
            GF_SECURITY_ADMIN_PASSWORD: admin
            GF_USERS_ALLOW_SIGN_UP: "false"
        volumes:
            # Provisions the Prometheus datasource so Grafana is usable on
            # first start on every environment. No dashboards are provisioned —
            # none have been authored.
            - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
            - data-collector-grafana-data:/var/lib/grafana
        networks:
            - data-collector-net
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"

    market-subscriptions:
        build: ./market-subscriptions
        container_name: market-subscriptions
        hostname: market-subscriptions
        restart: on-failure
        depends_on:
            postgres:
                condition: service_healthy
        ports:
            - "8090:8090" # host: http://localhost:8090
        environment:
            # These win over the image's .env, so the same image runs anywhere.
            PORT: 8090
            DATABASE_URL: "postgres://postgres:postgres@postgres:5432/markets"
            # NiFi's control-plane endpoints. Reachable on the compose network by
            # hostname; both resolved URLs are logged at startup.
            NIFI_BASE_URL: "http://nifi:8081/control-plane"
            NIFI_SUBSCRIBE_PATH: /subscribe
            NIFI_UNSUBSCRIBE_PATH: /unsubscribe
            NIFI_TIMEOUT: 10s
            NIFI_MAX_RETRIES: 3
            NIFI_RETRY_DELAY: 2s
            UI_REFRESH_SECONDS: 10
        networks:
            - data-collector-net
        healthcheck:
            test: [ "CMD-SHELL", "wget -qO- http://localhost:8090/healthz >/dev/null || exit 1" ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 15s

    web:
        build: ./web
        container_name: orderbook-web
        hostname: orderbook-web
        restart: on-failure
        depends_on:
            kafka:
                condition: service_healthy
            postgres:
                condition: service_healthy
        ports:
            - "3000:3000" # host: http://localhost:3000
        environment:
            PORT: 3000
            KAFKA_BROKER: kafka:29092
            DATABASE_URL: "postgres://postgres:postgres@postgres:5432/markets"
            SCHEMA_REGISTRY_URL: http://schema-registry:8082
        networks:
            - data-collector-net

volumes:
    data-collector-kafka-data:
    data-collector-kafka-secrets:
    data-collector-schema-registry-secrets:
    data-collector-postgres-data:
    data-collector-postgres-lib:
    data-collector-nifi-conf:
    data-collector-nifi-state:
    data-collector-nifi-logs:
    data-collector-nifi-python-extensions:
    data-collector-nifi-database-repository:
    data-collector-nifi-nar-extensions:
    data-collector-nifi-provenance-repository:
    data-collector-nifi-content-repository:
    data-collector-nifi-flowfile-repository:
    data-collector-jobmanager-logs:
    data-collector-taskmanager-1-logs:
    data-collector-taskmanager-2-logs:
    data-collector-taskmanager-3-logs:
    data-collector-taskmanager-4-logs:
    data-collector-flink-ha:
    data-collector-flink-archive:
    data-collector-zk-data:
    data-collector-zk-datalog:
    data-collector-redis-data:
    data-collector-prometheus-data:
    data-collector-alertmanager-data:
    data-collector-grafana-data:

networks:
    data-collector-net:
        driver: bridge
