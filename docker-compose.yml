---
# Full stack for the raw-normalization pipeline: the Flink image builds from ./flink/normalizer
# and the four taskmanagers have 3 slots each, enough for the 8 jobs submitted to this one
# cluster via flink/run-job.sh with four slots spare.
services:
    # M3 — the HA store. Without it nothing remembers that eight jobs were ever
    # submitted: a JobManager restart comes back as an empty cluster and recovery
    # is a human running `make run-all-jobs`. With it the JobManager re-reads the
    # job graphs on boot and resubmits them unattended.
    #
    # HA does not require checkpointing and stays consistent with the
    # postponement: there is no checkpoint to restore, so recovered jobs start
    # with empty state at `latest` and re-baseline, which is the restart semantic
    # already chosen. A single node is a SPOF; accepted, because the missing
    # capability is job recovery across a JobManager restart and one node
    # delivers it. Ensemble + standby JobManager is a later item.
    zookeeper:
        image: zookeeper:3.9
        container_name: zookeeper
        hostname: zookeeper
        restart: unless-stopped
        environment:
            ZOO_MY_ID: 1
            ZOO_4LW_COMMANDS_WHITELIST: srvr,ruok
        volumes:
            - data-collector-zk-data:/data
            - data-collector-zk-datalog:/datalog
        networks:
            - data-collector-net
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"
        healthcheck:
            # zkServer.sh rather than `echo ruok | nc`: nc is not guaranteed to be
            # in this image, and zkServer.sh ships with ZooKeeper itself. It costs
            # a JVM start per probe, hence the 10s timeout.
            test: [ "CMD-SHELL", "zkServer.sh status" ]
            interval: 15s
            timeout: 10s
            retries: 5
            start_period: 30s

    jobmanager:
        build: ./flink/normalizer
        container_name: jobmanager
        hostname: jobmanager
        restart: unless-stopped
        command: jobmanager
        depends_on:
            zookeeper:
                condition: service_healthy
        ports:
            - "7070:8081"
            - "9249:9249"
        environment:
            FLINK_PROPERTIES: |
                jobmanager.rpc.address: jobmanager

                # Explicit on purpose: Flink defaults restart-strategy.type to
                # `disable` only because checkpointing is off, so today the first
                # exception in any job kills it permanently. Backoff is longer
                # than Flink's defaults because with no checkpoints every restart
                # costs a full resync.
                restart-strategy.type: exponential-delay
                restart-strategy.exponential-delay.initial-backoff: 10 s
                restart-strategy.exponential-delay.max-backoff: 5 min
                restart-strategy.exponential-delay.backoff-multiplier: 2.0
                restart-strategy.exponential-delay.reset-backoff-threshold: 15 min

                # M3. All four keys are host-agnostic on purpose: `zookeeper` is a
                # compose service name resolved on the internal network and the
                # storageDir is a container path on a shared named volume, so this
                # file still runs unchanged on every dev and test environment.
                # cluster-id namespaces the ZK znodes; change it and the cluster
                # forgets every job it was told about.
                high-availability.type: zookeeper
                high-availability.zookeeper.quorum: zookeeper:2181
                high-availability.storageDir: file:///opt/flink/ha
                high-availability.cluster-id: /data-collector

                # S4. Terminal job state is written here as a JSON archive and
                # the historyserver reads the same directory, so an exception
                # outlives the JobManager that produced it. Only jobs reaching a
                # terminal state are archived: a job caught in M1's restart loop
                # is never written, so this is a post-mortem tool, not a live one.
                jobmanager.archive.fs.dir: file:///opt/flink/archive

                metrics.reporters: prom
                metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
                metrics.reporter.prom.port: 9249
        volumes:
            - data-collector-jobmanager-logs:/opt/flink/log
            - data-collector-flink-ha:/opt/flink/ha
            - data-collector-flink-archive:/opt/flink/archive
        networks:
            - data-collector-net
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"
        healthcheck:
            test: [ "CMD", "curl", "-f", "http://localhost:8081/overview" ]
            interval: 10s
            retries: 5

    # Four TaskManagers with 3 slots each (12 total) rather than one with 8.
    # The 8 jobs at parallelism 1 filled the single TM exactly, so there was no
    # room for a 9th job or any parallelism increase; spreading them over four
    # JVMs also means one OOM takes down ~2 jobs instead of the whole pipeline.
    #
    # SIZING NOT VERIFIED AGAINST THE TARGET HOST: 4 x 8g here plus everything
    # else in this file. Check free RAM on the box before deploying and scale
    # process.size / the container limit together if it does not fit.
    taskmanager-1:
        build: ./flink/normalizer
        container_name: taskmanager-1
        hostname: taskmanager-1
        restart: unless-stopped
        command: taskmanager
        ports:
            - "9250:9250"
        depends_on:
            jobmanager:
                condition: service_healthy
        environment:
            FLINK_PROPERTIES: |
                jobmanager.rpc.address: jobmanager
                taskmanager.numberOfTaskSlots: 3

                # M3, and NOT optional on the TaskManagers even though the report
                # shows these keys only on the JobManager. With HA on, the leader
                # publishes a random session id to ZooKeeper and fences RPC with
                # it; a TaskManager left on the default `NONE` would use the
                # standalone leader id and be rejected at registration. In an
                # ordinary standalone deployment this falls out of every node
                # sharing one config file — compose is what splits it per service.
                high-availability.type: zookeeper
                high-availability.zookeeper.quorum: zookeeper:2181
                high-availability.storageDir: file:///opt/flink/ha
                high-availability.cluster-id: /data-collector

                # The image default is 1728m, which leaves roughly 384 MB of task
                # heap shared by every job. managed.fraction is dropped from 0.4
                # because the hashmap state backend barely uses managed memory.
                # NEVER set env.java.opts.all here: the image uses that key for the
                # Java 21 --add-opens list and setting it replaces the list.
                taskmanager.memory.process.size: 8g
                taskmanager.memory.managed.fraction: 0.1
                env.java.opts.taskmanager: -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/opt/flink/log

                metrics.reporters: prom
                metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
                metrics.reporter.prom.port: 9250
        volumes:
            - data-collector-taskmanager-1-logs:/opt/flink/log
            # The HA storage dir doubles as the blob store, which is how a
            # TaskManager fetches job jars when the JobManager is unreachable. In a
            # real cluster it is one shared filesystem visible to every node; a
            # named volume mounted by all five containers is the compose equivalent.
            - data-collector-flink-ha:/opt/flink/ha
        networks:
            - data-collector-net
        deploy:
            resources:
                limits:
                    # Must stay ABOVE process.size. Set it lower and the kernel
                    # OOM-killer kills the container before Flink's memory
                    # accounting can report anything.
                    memory: 9g
        logging:
            driver: json-file
            options:
                max-size: "100m"
                max-file: "5"
        healthcheck:
            # Visibility only: Docker does NOT restart an unhealthy container, so
            # this marks a hung JVM rather than recovering it. M9's alerting is
            # what turns it into a signal.
            test: [ "CMD", "curl", "-f", "http://localhost:9250/metrics" ]
            interval: 20s
            timeout: 5s
            retries: 3
            start_period: 40s

