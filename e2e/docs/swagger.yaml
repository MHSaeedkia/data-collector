basePath: /
definitions:
  events.AggregatedLevel:
    properties:
      exchange_id:
        type: integer
      price:
        type: string
      quantity:
        type: string
      simulation:
        type: integer
    type: object
  events.ControlCommand:
    properties:
      action:
        description: '"snapshot_request"'
        type: string
      exchange_id:
        type: integer
      pair_id:
        type: integer
      reason:
        description: '"no_baseline" | "sequence_gap"'
        type: string
      simulation:
        type: integer
    type: object
  events.OrderbookSnapshot:
    properties:
      asks:
        items:
          $ref: '#/definitions/events.PriceLevel'
        type: array
      bids:
        items:
          $ref: '#/definitions/events.PriceLevel'
        type: array
      event_time:
        type: string
      exchange_id:
        type: integer
      pair_id:
        type: integer
      simulation:
        description: |-
          Simulation is NiFi's flag carried up the pipeline: 0 = live data, 1 =
          simulation data, other values not yet defined. The book builder stamps
          the emitted book with the flag of the event that produced it.
        type: integer
    type: object
  events.PriceLevel:
    properties:
      price:
        type: string
      quantity:
        type: string
    type: object
  scenario.AggregatedBook:
    properties:
      asks:
        items:
          $ref: '#/definitions/events.AggregatedLevel'
        type: array
      bids:
        items:
          $ref: '#/definitions/events.AggregatedLevel'
        type: array
    type: object
  server.RunRequest:
    properties:
      exchange_id:
        example: 3
        type: integer
      ignore_event_time:
        description: |-
          IgnoreEventTime blanks EventTime on both sides before comparing. Only ex3
          wallex needs it: its wire carries no timestamp at all, so job 1 stamps
          processing time and the field is wall-clock. The levels are still asserted.
        type: boolean
      name:
        example: ex3-half-book
        type: string
      pair_id:
        example: 1
        type: integer
      sources:
        description: raw exchange documents, verbatim
        items:
          type: string
        type: array
      want_aggregated:
        allOf:
        - $ref: '#/definitions/scenario.AggregatedBook'
        description: |-
          WantAggregated is the aggregated view of the pair once every source is
          through — the last record on `p{PairID}-asks` and on `p{PairID}-bids`.
          Every scenario in this package spells it out, and a posted one should too.
          Nil does NOT mean "skip job 6": the expectation is then DERIVED from the
          last wanted snapshot, which is what the aggregated book must be when a
          single exchange feeds the pair.
          Only the final state is read — the aggregator emits one record per side
          per snapshot, so asserting the whole stream would restate WantSnapshots
          twice over.
      want_control_commands:
        description: |-
          WantControlCommands is every snapshot_request job 2 must have put on the
          shared `control-plane` topic, in order — the control plane's half of a gap,
          where WantRejects is the data plane's.

          Empty is a real expectation, not a skip: a scenario that leaves this out
          asserts that the pipeline asked NiFi for NOTHING, which is what makes a
          spurious request on a healthy feed a failure rather than something nobody
          looks at. A command is expected once per episode, not once per rejected
          event — job 2 sends one when the stream first goes untrustworthy
          (`no_baseline` or `sequence_gap`) and does not send another until a
          snapshot has re-synced the book, so a run holding three updates as
          `awaiting_snapshot` still wants exactly one command.
        items:
          $ref: '#/definitions/events.ControlCommand'
        type: array
      want_rejects:
        description: reject_reason of each dead-letter, e.g. "sequence_gap"
        items:
          type: string
        type: array
      want_snapshots:
        items:
          $ref: '#/definitions/events.OrderbookSnapshot'
        type: array
    type: object
  server.RunResponse:
    properties:
      duration_ms:
        example: 92310
        type: integer
      error:
        type: string
      name:
        example: ex3-half-book
        type: string
      status:
        enum:
        - ok
        - failed
        example: ok
        type: string
    type: object
host: localhost:9595
info:
  contact: {}
  description: |-
    Runs one end-to-end scenario against the normalizer pipeline: the stack is provisioned once when the server starts, then every request warms the pipeline up for its own exchange/pair, feeds the raw topic and checks what came back out.

    The same `Scenario` the compiled-in cases use, posted as JSON. Regenerate this spec with `swag init -g main.go -o docs` after changing the handler or the scenario struct.
  title: Orderbook E2E Harness API
  version: "1.0"
paths:
  /scenarios/run:
    post:
      consumes:
      - application/json
      description: |-
        Warms the pipeline up for the scenario's exchange/pair, produces every `sources` entry to `ex{exchange_id}-raw`, then reads the snapshot, rejected, control-plane and aggregated topics back and compares them to the `want_*` streams.

        `want_control_commands` is the control plane: the `snapshot_request` commands job 2 put on the shared `control-plane` topic asking NiFi to re-send a book it can no longer trust. Omitting it asserts that NONE were sent, which is what a healthy feed must produce — it is not a skip. Declare `action`, `exchange_id`, `pair_id` and `simulation` (always 1 here — the flag is carried from the event whose gap triggered the request, so a real exchange is never called on the strength of simulated data). The command's `id`/`source_ids` and its Kafka key are derived per run and checked structurally, so they are never declared. One command is sent per EPISODE, not per rejected event: job 2 asks once when the stream first goes untrustworthy (`no_baseline` or `sequence_gap`) and stays silent until a snapshot re-syncs the book, so three updates held as `awaiting_snapshot` still expect exactly one command.

        Job 6 is always asserted: `want_aggregated` is the book the pair's `p{pair_id}-asks` / `p{pair_id}-bids` topics must END on, and every level carries the `exchange_id` it came from because the aggregator unions across exchanges instead of summing them. Only the final record on each side is read, not the whole stream. Omitting `want_aggregated` does NOT skip the check — the expectation is then derived from the last `want_snapshots` entry with the scenario's exchange stamped on every level, which is exact only because a scenario feeds ONE exchange. Send it explicitly to say what you mean.

        A scenario that does not match is **200 with `"status":"failed"`**, not a 5xx: the run itself worked, the pipeline disagreed. A non-200 always means the scenario never ran.

        Runs are serialized — each one cancels the Flink jobs and recreates the exchange's topics, so a request arriving while another is in flight gets 409 instead of being queued. Expect a successful call to take minutes.

        "Try it out" is prefilled with the real `ex1-precision-dust` case — a nobitex REST snapshot plus a WS delta on ex1/pair 1, where two bid prices merge once truncated to the market's 2 places and a dust quantity truncates to zero and deletes its level. Send it as-is and it should come back `"status":"ok"`.
      parameters:
      - description: The scenario to run. Unknown fields are rejected, so a mistyped
          want_snapshots cannot silently pass.
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/server.RunRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The scenario ran; status says whether it matched
          schema:
            $ref: '#/definitions/server.RunResponse'
        "400":
          description: Body could not be decoded or failed validation
          schema:
            $ref: '#/definitions/server.RunResponse'
        "409":
          description: Another scenario is already running
          schema:
            $ref: '#/definitions/server.RunResponse'
      summary: Run one scenario
      tags:
      - scenarios
swagger: "2.0"
