# M9 — the stack already exports metrics from six places and, until this file
# existed, nothing scraped any of them. Every failure mode in the production
# review was detected by a human noticing stale data.
#
# Host-agnostic by construction (see M8's removal): every target below is a
# compose service name on data-collector-net, never a host address, so this
# file is identical on all five-plus dev and test environments.

global:
    scrape_interval: 15s
    evaluation_interval: 15s

alerting:
    alertmanagers:
        - static_configs:
              - targets: ["alertmanager:9093"]

rule_files:
    - /etc/prometheus/rules/*.yml

scrape_configs:
    # Cluster-wide state lives here: numRunningJobs, numRegisteredTaskManagers
    # and the per-job numRestarts are all JobManager-scope, not TaskManager.
    - job_name: flink-jobmanager
      static_configs:
          - targets: ["jobmanager:9249"]

    # Each TaskManager reports on 9250 inside the container; the host-side
    # 9250-9253 spread is irrelevant here because we scrape over the network.
    # Listed explicitly rather than discovered: there are exactly four, and a
    # missing one has to show up as `up == 0` instead of silently vanishing.
    - job_name: flink-taskmanager
      static_configs:
          - targets:
                - "taskmanager-1:9250"
                - "taskmanager-2:9250"
                - "taskmanager-3:9250"
                - "taskmanager-4:9250"

    - job_name: kafka-exporter
      static_configs:
          - targets: ["kafka-exporter:9308"]

    - job_name: redis-exporter
      static_configs:
          - targets: ["redis-exporter:9121"]

    - job_name: lpa-staleness-exporter
      static_configs:
          - targets: ["lpa-staleness-exporter:9309"]

    - job_name: prometheus
      static_configs:
          - targets: ["localhost:9090"]
