# Provisioned so Grafana is usable on first start instead of needing the
# datasource added by hand on every environment. `prometheus:9090` is the
# compose service name, so this stays host-agnostic.
#
# No dashboards are provisioned — none have been authored, and shipping an
# empty dashboards provider would only add a directory to keep in sync.

apiVersion: 1

datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus:9090
      isDefault: true
      editable: false
